# The runner fetches the public corpus (Logic's saves of a blank project) once it is pinned in
# tests/goldens/corpus.json and then requires every public golden to run; the owner's corpus
# and the console scene are not here, so those goldens and tests/rig still skip.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check src tests
          python -m pf_core.guards --root src
          python -m pf_core.guards --root tests

      - name: Fetch the public corpus
        if: hashFiles('tests/goldens/corpus.json') != ''
        run: python bin/fetch_corpus.py

      - name: Tests
        env:
          LOGICXKIT_REQUIRE_GOLDENS: ${{ hashFiles('tests/goldens/corpus.json') != '' && 'public' || '' }}
        run: |
          set -o pipefail
          python -m pytest -q | tee pytest.out
          grep -E "goldens: [0-9]+ of [0-9]+ keys found" pytest.out

      - name: The sdist collects its own tests
        run: |
          python -m pip install build
          python -m build --sdist --outdir "$RUNNER_TEMP/sdist"
          mkdir "$RUNNER_TEMP/unpacked"
          tar xzf "$RUNNER_TEMP"/sdist/*.tar.gz -C "$RUNNER_TEMP/unpacked" --strip-components=1
          cd "$RUNNER_TEMP/unpacked" && python -m pytest --collect-only -q -p no:cacheprovider
