# Builds and checks a distribution on a v* tag, then publishes it to PyPI.
#
# The upload waits: the `pypi` environment requires a reviewer and is limited to v* tags, so a
# tag push builds, then pauses for approval before anything reaches PyPI. Confirm both halves
# are still there before trusting it — a branch policy without a reviewer is not a gate:
#
#   gh api repos/phierceweb/logicxkit/environments/pypi \
#     --jq '[.protection_rules[]|select(.type=="required_reviewers")|.reviewers[].reviewer.login]'
#
# Uploading needs a PyPI Trusted Publisher registered for project "logicxkit", owner
# phierceweb, repo logicxkit, workflow publish.yml, environment pypi. A published version
# number can never be re-uploaded.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject builds the wrong version number, and a version
      # number that reaches PyPI can never be reused.
      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != pyproject version $PKG_VERSION — bump pyproject (and CHANGELOG) before tagging"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Confirm the wheel carries the Swift helpers and no reference material
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          swift = [n for n in names if n.endswith(".swift")]
          assert swift, f"no .swift in {wheel.name} — package-data regressed"
          leaked = [n for n in names if n.endswith((".logicx", ".cst", ".pst", ".scn", ".wav", ".aif"))]
          assert not leaked, f"reference material in the wheel: {leaked}"
          print(f"{wheel.name}: {len(swift)} swift helper(s), no reference material")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          # Artifacts on a public repo are downloadable and survive a history rewrite.
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing (OIDC); no token in the repo
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
